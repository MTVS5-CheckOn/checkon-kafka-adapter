plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.checkon'
version = '0.0.1-SNAPSHOT'
description = 'checkon-kafka-adapter'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-kafka'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-kafka-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-restclient-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-kafka'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    // A developer's local .env must not enable runtime workers in context tests.
    // Integration tests that need them set their own higher-priority properties.
    systemProperty 'checkon.ai.risk-detection.enabled', 'false'
    systemProperty 'checkon.ai.risk-detection.worker-enabled', 'false'
    systemProperty 'checkon.kafka.risk-detection.enabled', 'false'
    systemProperty 'checkon.ai.problem-generation.worker-enabled', 'false'
    systemProperty 'checkon.kafka.problem-generation.enabled', 'false'
    systemProperty 'checkon.ai.counsel-draft.enabled', 'false'
    systemProperty 'checkon.ai.counsel-draft.worker-enabled', 'false'
    systemProperty 'checkon.kafka.counsel-draft.enabled', 'false'
}
