spring:
  config:
    # .env is a Java properties-compatible file. It is optional so CI and
    # deployment environments can continue to supply ordinary environment variables.
    import: "optional:file:.env[.properties]"
  application:
    name: checkon-kafka-adapter
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      properties:
        isolation.level: read_committed
        max.partition.fetch.bytes: 6291456
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        acks: all
        enable.idempotence: true
        max.request.size: 6291456
        compression.type: zstd
    listener:
      ack-mode: record
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    url: ${FLYWAY_DB_URL}
    user: ${FLYWAY_DB_USER}
    password: ${FLYWAY_DB_PASSWORD}

server:
  port: ${SERVER_PORT:8081}

checkon:
  ai:
    problem-generation:
      worker-enabled: ${AI_PROBLEM_GENERATION_WORKER_ENABLED:false}
      base-url: ${AI_PROBLEM_GENERATION_BASE_URL:}
      problems-path: ${AI_PROBLEM_GENERATION_PATH:/v1/problems}
      diagnosis-path: ${AI_PROBLEM_DIAGNOSIS_PATH:/v1/diagnosis}
      poll-delay: ${AI_PROBLEM_GENERATION_WORKER_POLL_DELAY:1s}
      poll-interval: ${AI_PROBLEM_GENERATION_AI_POLL_INTERVAL:2s}
      lock-timeout: ${AI_PROBLEM_GENERATION_LOCK_TIMEOUT:6m}
      retry-initial-delay: ${AI_PROBLEM_GENERATION_RETRY_INITIAL_DELAY:1s}
      max-attempts: ${AI_PROBLEM_GENERATION_MAX_ATTEMPTS:5}
      connect-timeout: ${AI_PROBLEM_GENERATION_CONNECT_TIMEOUT:3s}
      read-timeout: ${AI_PROBLEM_GENERATION_READ_TIMEOUT:300s}
      max-elapsed: ${AI_PROBLEM_GENERATION_MAX_ELAPSED:21m}
      max-normalized-result-bytes: ${AI_PROBLEM_GENERATION_MAX_RESULT_BYTES:3145728}
    risk-detection:
      enabled: ${AI_RISK_DETECTION_ENABLED:false}
      base-url: ${AI_BASE_URL:}
      detect-path: ${AI_DETECT_PATH:}
      connect-timeout: ${AI_CONNECT_TIMEOUT:}
      read-timeout: ${AI_READ_TIMEOUT:}
      worker-enabled: ${AI_RISK_DETECTION_WORKER_ENABLED:false}
      poll-delay: ${AI_RISK_DETECTION_POLL_DELAY:1s}
      lock-timeout: ${AI_RISK_DETECTION_LOCK_TIMEOUT:75s}
      retry-initial-delay: ${AI_RISK_DETECTION_RETRY_INITIAL_DELAY:1s}
      max-attempts: ${AI_RISK_DETECTION_MAX_ATTEMPTS:3}
  kafka:
    problem-generation:
      enabled: ${PROBLEM_GENERATION_KAFKA_ENABLED:false}
      request-topic: ${PROBLEM_GENERATION_REQUEST_TOPIC:checkon.ai.problem-generation.requests.v1}
      result-topic: ${PROBLEM_GENERATION_RESULT_TOPIC:checkon.ai.problem-generation.results.v1}
      consumer-group-id: ${PROBLEM_GENERATION_CONSUMER_GROUP:checkon-ai-adapter-problem-generation-v1}
      outbox-poll-delay: ${PROBLEM_GENERATION_OUTBOX_POLL_DELAY:1s}
      outbox-lock-timeout: ${PROBLEM_GENERATION_OUTBOX_LOCK_TIMEOUT:30s}
      outbox-retry-delay: ${PROBLEM_GENERATION_OUTBOX_RETRY_DELAY:5s}
      producer-send-timeout: ${PROBLEM_GENERATION_PRODUCER_SEND_TIMEOUT:10s}
      outbox-max-attempts: ${PROBLEM_GENERATION_OUTBOX_MAX_ATTEMPTS:8}
    risk-detection:
      enabled: ${RISK_DETECTION_KAFKA_ENABLED:false}
      requested-topic: ${RISK_DETECTION_REQUESTED_TOPIC:checkon.risk-detection.requested.v1}
      completed-topic: ${RISK_DETECTION_COMPLETED_TOPIC:checkon.risk-detection.completed.v1}
      failed-topic: ${RISK_DETECTION_FAILED_TOPIC:checkon.risk-detection.failed.v1}
      consumer-group-id: ${RISK_DETECTION_CONSUMER_GROUP:checkon-ai-adapter-risk-detection-v1}
      outbox-poll-delay: ${RISK_DETECTION_OUTBOX_POLL_DELAY:1s}
      outbox-lock-timeout: ${RISK_DETECTION_OUTBOX_LOCK_TIMEOUT:30s}
      outbox-retry-delay: ${RISK_DETECTION_OUTBOX_RETRY_DELAY:5s}
      producer-send-timeout: ${RISK_DETECTION_PRODUCER_SEND_TIMEOUT:10s}
      outbox-max-attempts: ${RISK_DETECTION_OUTBOX_MAX_ATTEMPTS:8}
  execution:
    risk-detection-pool-size: ${RISK_DETECTION_WORKER_POOL_SIZE:1}
    problem-generation-pool-size: ${PROBLEM_GENERATION_WORKER_POOL_SIZE:1}
    outbox-pool-size: ${OUTBOX_PUBLISHER_POOL_SIZE:1}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
